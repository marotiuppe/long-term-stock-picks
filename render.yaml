services:
  - type: web
    name: long-term-stock-picks
    runtime: python
    plan: free               # 512 MB RAM, no disk: prices, the scan and accounts all live in PostgreSQL
    buildCommand: pip install -r requirements.txt
    startCommand: cd app && python server.py
    autoDeployTrigger: checksPass   # deploy on a push to the branch only after the GitHub Actions CI passes
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: HOST
        value: 0.0.0.0
      - key: STOCKPICKS_SECURE_COOKIES
        value: "1"
      - key: DATABASE_URL        # your PostgreSQL URL; enter it in the Render dashboard
        sync: false
      - key: STOCKPICKS_SECRET_KEY   # encrypts saved Groww keys; generate once (see README) and keep it
        sync: false
      # Shown on the Privacy Policy, Terms, Cookie Policy and Disclaimer. Fill these in the Render dashboard before you share the site.
      - key: LEGAL_OPERATOR      # your name or company
        sync: false
      - key: LEGAL_EMAIL         # contact and grievance email
        sync: false
      - key: LEGAL_JURISDICTION  # city and state for the courts clause, for example "Pune, Maharashtra"
        sync: false
      - key: LEGAL_ADDRESS       # optional postal address
        sync: false
      - key: STATS_TOKEN         # secret that unlocks /stats.html (page-view counts). Leave unset to switch the stats off.
        sync: false
