services:
  - type: web
    name: long-term-stock-picks
    runtime: python
    plan: standard           # 2 GB RAM: the market scan holds about 650 MB of prices plus scoring; starter (512 MB) runs out of memory
    numInstances: 1          # the in-memory rate limiter and scan state need a single instance
    buildCommand: pip install -r requirements.txt
    startCommand: cd app && python server.py
    autoDeployTrigger: checksPass   # deploy on a push to the branch only after the GitHub Actions CI passes
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: HOST
        value: 0.0.0.0
      - key: STOCKPICKS_SECURE_COOKIES
        value: "1"
      - key: DATABASE_URL    # your PostgreSQL URL; enter it in the Render dashboard
        sync: false
      - key: STOCKPICKS_DATA_DIR
        value: /var/data
    disk:
      name: stockpicks-data
      mountPath: /var/data
      sizeGB: 2
